name: harness-tool CI

on:
  push:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]

defaults:
  run:
    working-directory: harness

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only (docs/DECISIONS.md D-110). Each job tests and builds on its own system;
        # the `package-on-24-04` job then runs the package built on 22.04 (glibc 2.35) on 24.04.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # a hung test must not block the run for six hours
    env:
      HARNESS_TIME_FACTOR: "3"  # shared runners are slower than a workstation; limits in tests scale by this
      HARNESS_REQUIRE_BROWSER: "1"  # the clickable prototype tests must run, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 poppler-utils
      - run: python -m pip install -e ".[gui,dev]"
      - name: Chromium for the prototype tests
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - run: python -m tools.check_reproducible
      - run: python -m tools.build_installer
      - run: python -m tools.build_deb
      - name: Frozen app self-test
        run: dist/harness-tool/harness-tool --selftest
      - run: python -m tools.gen_sbom
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tool-${{ matrix.os }}
          if-no-files-found: error
          path: |
            harness/dist/*.deb
            harness/dist/*.tar.gz
            harness/dist/release-docs/*

  package-on-24-04:
    # The release package is built on 22.04 so that it also starts on newer systems; prove it.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-tool-ubuntu-22.04
          path: pkg
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Run the tarball built on 22.04
        working-directory: pkg
        run: |
          ls -R .
          tar xzf harness-tool-*-linux-*.tar.gz
          QT_QPA_PLATFORM=offscreen ./harness-tool/harness-tool --selftest
          HOME="$PWD/home" ./harness-tool/install.sh
          HOME="$PWD/home" "$PWD/home/.local/bin/harness" --version
          HOME="$PWD/home" ./harness-tool/uninstall.sh
      - name: Install and run the .deb built on 22.04
        working-directory: pkg
        run: |
          sudo apt-get install -y ./harness-tool_*_amd64.deb
          harness --version
          QT_QPA_PLATFORM=offscreen harness-tool --selftest
          test -f /usr/share/doc/harness-tool/copyright
          sudo apt-get remove -y harness-tool
          ! test -e /opt/harness-tool
