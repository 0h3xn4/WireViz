name: harness-tool CI

on:
  push:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]

defaults:
  run:
    working-directory: harness

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only (docs/DECISIONS.md D-110). 22.04 builds the release packages (glibc 2.35), 24.04 checks they run.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[gui,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - run: python -m tools.check_reproducible
      - run: python -m tools.build_installer
      - run: python -m tools.build_deb
      - name: Frozen app self-test
        run: dist/harness-tool/harness-tool --selftest
      - run: python -m tools.gen_sbom
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tool-${{ matrix.os }}
          path: |
            harness/dist/*.deb
            harness/dist/*.tar.gz
            harness/dist/release-docs/*
