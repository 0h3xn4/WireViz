name: harness-tool CI

on:
  push:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness-ci.yml"]

defaults:
  run:
    working-directory: harness

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # RHEL/Rocky 8 builds for release must run in a rockylinux:8 container (glibc 2.28); see docs/RELEASE.md
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[gui,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
      - run: python -m tools.check_reproducible
      - run: python -m tools.build_installer
      - name: Frozen app self-test
        shell: bash
        run: |
          exe=dist/harness-tool/harness-tool; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --selftest
      - run: python -m tools.gen_sbom
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tool-${{ matrix.os }}
          path: |
            harness/dist/*.zip
            harness/dist/*.tar.gz
            harness/dist/release-docs/*
