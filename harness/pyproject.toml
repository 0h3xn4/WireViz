[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-tool"
version = "0.0.1"
description = "Offline spacecraft harness design tool"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["pydantic==2.13.5", "openpyxl==3.1.5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.11.2"]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "pytest-qt==4.5.0", "hypothesis==6.168.5",
  "mypy==2.4.0", "ruff==0.16.10", "cyclonedx-bom==7.5.0", "pip-licenses==5.5.5",
  "pyinstaller==6.22.3", "playwright==1.63.0",
]

[project.scripts]
harness = "harness_tool.cli.main:main"

[project.gui-scripts]
harness-gui = "harness_tool.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = ["gui: needs Qt (run with QT_QPA_PLATFORM=offscreen)", "ux: drives the clickable prototype in a browser", "perf: timing checks at stress size"]

[tool.coverage.run]
source = ["harness_tool.core"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if sys.platform == \"win32\":", "pragma: no cover"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["tests.*"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.test_generate"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"src/harness_tool/core/drc/*.py" = ["E501"]  # plain-language messages
"src/harness_tool/core/outputs/*.py" = ["E501"]  # table rows
"src/harness_tool/core/integrity.py" = ["E501"]  # long plain-language messages
"src/harness_tool/core/io/loader.py" = ["E501"]
"src/harness_tool/core/starter.py" = ["E501"]  # data tables
"src/harness_tool/core/samples.py" = ["E501"]
"src/harness_tool/core/edit.py" = ["E501"]
"src/harness_tool/gui/*.py" = ["E501"]  # style sheet and UI text
"src/harness_tool/core/generate/*.py" = ["E501"]  # long plain-language messages
"src/harness_tool/core/verify.py" = ["E501"]
"src/harness_tool/core/checks.py" = ["E501"]
"src/harness_tool/core/imports.py" = ["E501"]
"tools/*" = ["S101", "S603", "S607", "E501"]
"tests/*" = ["S101", "S311", "S603", "S607", "E501"]
